[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
workspace-core = { path = "crates/core" }
workspace-provider-boat = { path = "crates/provider-boat" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
